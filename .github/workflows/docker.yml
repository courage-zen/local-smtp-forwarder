name: Build and publish image

# Builds a multi-arch (amd64 + arm64) Linux image and pushes it to ghcr.io.
# - On push to main: tag as `latest` + `<short-sha>`.
# - On tag v*: tag as the version (e.g. v1.0.0) and `latest`, then create a
#   GitHub Release with the image as .tar.gz attachments (one per arch).
# - On PR: build only, no push (validates the Dockerfile still builds).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # Only on version tags: export the just-pushed image per arch as
    # image-<arch>.tar.gz and attach them to a GitHub Release.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export images per arch
        id: export
        run: |
          tag="${GITHUB_REF_NAME}"   # e.g. v1.0.0
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}"
          for arch in amd64 arm64; do
            # Pull the arch-specific manifest digest, save it, gzip it.
            digest=$(docker buildx imagetools inspect "${ref}" --format "{{range .Manifest.Manifests}}{{if eq .Platform.Architecture \"${arch}\"}}{{.Digest}}{{end}}{{end}}")
            docker pull "${ref}@${digest}"
            docker save "${ref}@${digest}" | gzip > "local-smtp-forwarder-${tag}-linux-${arch}.tar.gz"
            echo "asset-${arch}=local-smtp-forwarder-${tag}-linux-${arch}.tar.gz" >> "$GITHUB_OUTPUT"
          done

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.export.outputs.asset-amd64 }}
            ${{ steps.export.outputs.asset-arm64 }}
          generate_release_notes: true
